.app{
  --concrete:#E9EAEC; --surface:#fff; --ink:#14181D; --muted:#727880; --line:#D6D9DD;
  --blue:#1B58C4; --red:#D42A2A; --yellow:#E3B505; --green:#2E8B4A;
  background:var(--concrete); color:var(--ink); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; padding-bottom:40px;
}
.app *{box-sizing:border-box;}
.app button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
.app b,.app .num{font-variant-numeric:tabular-nums;}
.app :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.top{position:sticky;top:0;z-index:20;background:rgba(233,234,236,.94);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);}
.tabs{display:flex;gap:2px;background:#DCDEE1;border-radius:8px;padding:2px;}
.tab{padding:6px 16px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.stat{font-size:12px;color:var(--muted);letter-spacing:.02em;}
.stat b{font-size:15px;color:var(--ink);margin-right:2px;}
.dot{margin:0 6px;color:var(--line);}

.main{max-width:520px;margin:0 auto;padding:14px 12px 0;}
.datebar{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin:4px 2px 12px;}
.empty{background:var(--surface);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;}
.empty p{margin:0 0 14px;}

.card{background:var(--surface);border-radius:14px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,24,29,.06);transition:box-shadow .18s;}
.card.open{box-shadow:0 6px 22px rgba(20,24,29,.13);}
.card-head{display:flex;align-items:center;padding-left:14px;}
.head-btn{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:14px 14px 14px 0;text-align:left;}
.grip{display:flex;align-items:center;flex-shrink:0;padding:12px 8px 12px 0;margin-right:2px;
  color:#B7BBC1;fill:currentColor;touch-action:none;cursor:grab;}
.grip:active{color:var(--blue);cursor:grabbing;}
.card.dragging{position:relative;z-index:10;box-shadow:0 14px 34px rgba(20,24,29,.26);}
.dropline{height:3px;border-radius:2px;background:var(--blue);margin:3px 2px 8px;}
.ex-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.count{font-size:12px;color:var(--muted);flex-shrink:0;}
.chip{font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;background:#EDEFF1;color:var(--muted);flex-shrink:0;}
.g-0{background:#FBE4E4;color:#A82121;} /* \u80F8 */
.g-1{background:#E1EAFB;color:#17458F;} /* \u80CC\u4E2D */
.g-2{background:#FBF1D6;color:#8A6A04;} /* \u80A9 */
.g-3{background:#EDE6F7;color:#5A3B94;} /* \u8155 */
.g-4{background:#E2F1E7;color:#1F6B39;} /* \u811A */
.g-5{background:#E6EFF0;color:#2C5F63;} /* \u4F53\u5E79 */
.g-6{background:#F3E7DF;color:#8A4B22;} /* \u5168\u8EAB */
.g-x{background:#EDEFF1;color:#6E747E;}

.sets{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 13px;}
.setchip{font-size:12px;background:#F1F2F4;border-radius:6px;padding:4px 9px;color:#414750;}
.setchip b{color:var(--ink);font-weight:700;}

.panel{border-top:1px solid var(--line);padding:14px;}
.prev{font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.prev-sets{display:flex;gap:6px;}
.prev-sets span{background:#F1F2F4;border-radius:4px;padding:2px 6px;font-variant-numeric:tabular-nums;}

.inputs{display:flex;flex-direction:column;gap:10px;}
.field{display:flex;align-items:center;gap:10px;}
.stepper{width:62px;height:62px;border-radius:14px;background:#F1F2F4;font-size:26px;font-weight:600;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .1s,transform .1s;}
.stepper:active{background:#E2E4E7;transform:scale(.96);}
.value{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:3px;}
.value b{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.value small{font-size:13px;color:var(--muted);font-weight:600;}
.bwlabel{font-size:26px!important;color:var(--muted);letter-spacing:.04em;}

.actions{display:flex;justify-content:center;margin:18px 0 6px;}
.plate{width:104px;height:104px;border-radius:50%;background:#1B1E23;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(20,24,29,.28);transition:transform .1s;}
.plate:active{transform:scale(.94);}
.plate-inner{width:74px;height:74px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;letter-spacing:.06em;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.16);}

.sub{display:flex;gap:8px;justify-content:center;margin-top:6px;}
.ghost{font-size:13px;color:var(--muted);padding:9px 14px;border-radius:8px;background:#F4F5F6;font-weight:600;}
.ghost:disabled{opacity:.4;}
.ghost.danger{color:var(--red);}
.ghost.wide{width:100%;}

.add{width:100%;padding:15px;border-radius:14px;background:var(--surface);border:1.5px dashed var(--line);
  font-weight:700;font-size:14px;color:var(--muted);margin-top:4px;}

.rest{position:sticky;top:0;z-index:30;background:#1B1E23;color:#fff;display:flex;align-items:center;
  gap:10px;padding:9px 14px;position:relative;overflow:hidden;}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(227,181,5,.28);transition:width .25s linear;}
.rest-label{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--yellow);position:relative;}
.rest-time{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;position:relative;flex:1;}
.rest-skip{font-size:12px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:6px;color:#fff;position:relative;font-weight:600;}

.logrow{display:block;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;}
.logtop{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.e1rm{font-size:11px;color:var(--muted);flex-shrink:0;}
.e1rm b{font-size:16px;color:var(--ink);}
.e1rm em{font-style:normal;font-weight:700;margin-left:5px;}
.e1rm .up{color:var(--green);} .e1rm .down{color:var(--red);}
.trend{width:100%;height:56px;display:block;}
.histrow{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.histdate{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;}
.histrow .sets{padding:0;}
.histvol{font-size:11px;color:var(--muted);margin-top:8px;}
.back{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;}
.backup{background:var(--surface);border-radius:14px;padding:16px;margin:18px 0 10px;}
.backup p{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 14px;}
.backup .frow{gap:8px;}
.backup .ghost{flex:1;text-align:center;padding:13px;}
.filelabel{position:relative;overflow:hidden;display:block;}
.filelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.note{font-size:12px;color:var(--blue);background:#E8EEFA;border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.7;}
.ver{font-size:11px;color:#A2A8B0;margin-top:12px;text-align:right;}

.sheet-wrap{position:fixed;inset:0;background:rgba(20,24,29,.42);z-index:50;display:flex;align-items:flex-end;}
.sheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:8px 12px 20px;max-height:82vh;display:flex;flex-direction:column;}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
.search{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);font-size:16px;
  background:#F7F8F9;margin-bottom:8px;font-family:inherit;}
.search:focus{outline:none;border-color:var(--blue);background:#fff;}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -12px;
  padding-left:12px;padding-right:12px;scrollbar-width:none;}
.gtabs::-webkit-scrollbar{display:none;}
.gtab{flex-shrink:0;padding:9px 14px;border-radius:20px;background:#F1F2F4;font-size:13px;font-weight:700;
  color:var(--muted);display:flex;align-items:center;gap:5px;transition:background .12s;}
.gtab em{font-style:normal;font-size:10px;opacity:.6;font-variant-numeric:tabular-nums;}
.gtab.on{background:#1B1E23;color:#fff;}
.sechead{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);
  padding:12px 6px 6px;position:sticky;top:0;background:var(--surface);}
.pickempty{padding:28px 12px;text-align:center;font-size:13px;color:var(--muted);line-height:1.7;}
.picklist{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pickrow{display:flex;align-items:center;gap:9px;width:100%;padding:14px 6px;text-align:left;border-bottom:1px solid #F0F1F3;}
.pickrow.new{color:var(--blue);font-weight:700;font-size:14px;}
.freq{font-size:11px;color:var(--muted);}
.pickwrap{display:flex;align-items:center;border-bottom:1px solid #F0F1F3;}
.pickwrap .pickrow{border-bottom:none;flex:1;min-width:0;}
.mine{font-size:10px;font-weight:700;color:var(--blue);background:#E8EEFA;padding:2px 6px;border-radius:4px;flex-shrink:0;}
.del{width:40px;height:40px;font-size:20px;color:var(--muted);flex-shrink:0;border-radius:8px;}
.del:active{background:#F1F2F4;}

.newform{padding:14px 6px 6px;}
.newform .search{margin-bottom:14px;}
.flabel{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:0 0 7px 2px;}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.fchip{padding:9px 13px;border-radius:9px;background:#F1F2F4;font-size:13px;font-weight:700;color:var(--muted);}
.fchip.on{background:var(--blue);color:#fff;}
.bwtoggle{display:flex;align-items:center;gap:9px;width:100%;padding:11px 10px;border-radius:10px;
  background:#F7F8F9;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;text-align:left;}
.bwtoggle.on{background:#E8EEFA;color:var(--blue);}
.bwtoggle .box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.bwtoggle.on .box{background:var(--blue);border-color:var(--blue);color:#fff;}
.frow{display:flex;gap:8px;align-items:center;}
.fsave{flex:1;padding:15px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;}
.fsave:disabled{background:#C9CDD3;}

@media (prefers-reduced-motion:reduce){.app *{transition:none!important;}}
