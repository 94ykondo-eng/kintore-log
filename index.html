.app{
  /* \u30D7\u30EC\u30FC\u30C8\uFF08\u91CD\u91CF\u76E4\uFF09\u306E\u8272\u3092\u305D\u306E\u307E\u307E\u60C5\u5831\u306E\u8272\u306B\u4F7F\u3046 */
  --void:#0A0C0F; --steel:#141922; --steel2:#1B212B; --line:#262E3A;
  --ink:#F2F4F7; --dim:#8A93A0; --faint:#727C88;
  --act:#2E6BE0; --act-lit:#4D8CFF;
  --up:#3DD68C; --down:#FF6B6B; --hold:#F2B705;
  background:var(--void); color:var(--ink); min-height:100vh; padding:3px 0 48px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app *{box-sizing:border-box;}
.app button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
.app b,.app .num{font-variant-numeric:tabular-nums;}
.app :focus-visible{outline:2px solid var(--act-lit);outline-offset:2px;}

/* \u5929\u9762\u306B\u30D7\u30EC\u30FC\u30C84\u8272\u300225kg\u8D64\u30FB20kg\u9752\u30FB15kg\u9EC4\u30FB10kg\u7DD1 */
.app::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:60;
  background:linear-gradient(90deg,#E23B3B 0 25%,#2E6BE0 25% 50%,#EFC03A 50% 75%,#37A05C 75% 100%);}

.top{position:sticky;top:3px;z-index:20;background:rgba(10,12,15,.92);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);}
.tabs{display:flex;gap:2px;background:var(--steel);border-radius:9px;padding:3px;}
.tab{padding:7px 18px;border-radius:6px;font-size:13px;font-weight:700;color:var(--dim);transition:.14s;}
.tab.on{background:var(--steel2);color:var(--ink);}
.stat{font-size:11px;color:var(--dim);letter-spacing:.04em;}
.stat b{font-size:15px;color:var(--ink);margin-right:3px;}
.dot{margin:0 7px;color:var(--faint);}

.main{max-width:520px;margin:0 auto;padding:16px 12px 0;}
/* \u7BC0\u898B\u51FA\u3057\u306F\u5B57\u9593\u3092\u958B\u3051\u305F\u5C0F\u3055\u306A\u5B57\u3067\u3002\u6570\u5B57\u3092\u4E3B\u5F79\u306B\u3059\u308B */
.datebar{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--faint);margin:6px 2px 14px;}
.hint{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--faint);margin-left:10px;}
.empty{background:var(--steel);border-radius:16px;padding:26px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.8;}
.empty p{margin:0 0 16px;}

.card{background:var(--steel);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:box-shadow .18s;}
.card.open{box-shadow:0 0 0 1px var(--line),0 10px 34px rgba(0,0,0,.55);}
.card-head{display:flex;align-items:center;padding-left:14px;}
.head-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:15px 14px 15px 0;text-align:left;}
.ex-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.count{font-size:11px;color:var(--dim);flex-shrink:0;letter-spacing:.02em;}
.grip{display:flex;align-items:center;flex-shrink:0;padding:12px 8px 12px 0;color:var(--faint);
  fill:currentColor;touch-action:none;cursor:grab;}
.grip:active{color:var(--act-lit);cursor:grabbing;}
.card.dragging{position:relative;z-index:10;box-shadow:0 0 0 1px var(--act);box-shadow:0 18px 40px rgba(0,0,0,.7);}
.dropline{height:3px;border-radius:2px;background:var(--act-lit);margin:3px 2px 8px;}

.chip{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.04em;}
.g-0{background:rgba(226,59,59,.16);color:#FF8F8F;}
.g-1{background:rgba(46,107,224,.18);color:#7FAAFF;}
.g-2{background:rgba(239,192,58,.16);color:#F5CF63;}
.g-3{background:rgba(138,95,214,.18);color:#B393F0;}
.g-4{background:rgba(55,160,92,.18);color:#5FCB89;}
.g-5{background:rgba(62,154,163,.18);color:#63BEC7;}
.g-6{background:rgba(196,112,58,.18);color:#DE9463;}
.g-x{background:var(--steel2);color:var(--dim);}

.sets{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px;}
.setchip{font-size:12px;background:var(--steel2);border-radius:6px;padding:5px 10px;color:var(--dim);
  font-variant-numeric:tabular-nums;}
.setchip b{color:var(--ink);font-weight:800;}

.panel{border-top:1px solid var(--line);padding:16px 14px;}
.prev{font-size:11px;color:var(--dim);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;letter-spacing:.02em;}
.prev-sets{display:flex;gap:6px;}
.prev-sets span{background:var(--steel2);border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums;color:var(--ink);}

.inputs{display:flex;flex-direction:column;gap:10px;}
.field{display:flex;align-items:center;gap:10px;}
.stepper{width:64px;height:64px;border-radius:16px;background:var(--steel2);font-size:26px;font-weight:600;
  color:var(--ink);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.1s;}
.stepper:active{background:#252D39;transform:scale(.95);}
.value{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:4px;}
.value b{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;}
.value small{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.04em;}
.bwlabel{font-size:28px!important;color:var(--dim);letter-spacing:.06em;}

/* \u8A18\u9332\u30DC\u30BF\u30F3\u306F\u30D7\u30EC\u30FC\u30C8\u305D\u306E\u3082\u306E\u3002\u4E2D\u5FC3\u306E\u8272\u306F\u935B\u3048\u3066\u3044\u308B\u90E8\u4F4D\u306E\u8272 */
.actions{display:flex;justify-content:center;margin:22px 0 8px;}
.plate{width:108px;height:108px;border-radius:50%;background:#0E1116;
  box-shadow:inset 0 0 0 2px #2A323D, 0 8px 24px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;transition:transform .1s;}
.plate:active{transform:scale(.93);}
.plate-inner{width:74px;height:74px;border-radius:50%;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;letter-spacing:.12em;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.2), 0 0 22px rgba(0,0,0,.35);}

.sub{display:flex;gap:8px;justify-content:center;margin-top:8px;}
.ghost{font-size:12px;color:var(--dim);padding:10px 15px;border-radius:9px;background:var(--steel2);font-weight:700;}
.ghost:disabled{opacity:.35;}
.ghost.danger{color:var(--down);}
.ghost.wide{width:100%;}
.add{width:100%;padding:16px;border-radius:16px;background:transparent;border:1.5px dashed var(--line);
  font-weight:700;font-size:14px;color:var(--dim);margin-top:4px;}
.add:active{border-color:var(--act);color:var(--act-lit);}

.rest{position:sticky;top:3px;z-index:30;background:#0E1116;color:var(--ink);display:flex;align-items:center;
  gap:12px;padding:11px 16px;overflow:hidden;border-bottom:1px solid var(--line);}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(242,183,5,.16);transition:width .25s linear;}
.rest-label{font-size:10px;letter-spacing:.24em;font-weight:800;color:var(--hold);position:relative;}
.rest-time{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;position:relative;flex:1;letter-spacing:-.01em;}
.rest-skip{font-size:11px;background:var(--steel2);padding:7px 13px;border-radius:7px;position:relative;font-weight:700;color:var(--dim);}

.ptabs{display:flex;gap:6px;margin:0 0 14px;}
.ptab{flex:1;padding:11px;border-radius:10px;background:var(--steel);font-size:13px;font-weight:700;color:var(--dim);}
.ptab.on{background:var(--ink);color:var(--void);}

.summary{background:var(--steel);border-radius:16px;padding:18px;margin-bottom:20px;}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-bottom:8px;}
.metric.big{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:16px;}
.mlabel{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--faint);margin-bottom:5px;}
.mval{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;}
.metric.big .mval{font-size:40px;}
.mval small{font-size:13px;font-weight:700;color:var(--dim);margin-left:4px;letter-spacing:0;}
.mdiff{font-size:11px;font-weight:800;color:var(--dim);margin-top:5px;letter-spacing:.02em;}
.mdiff.up{color:var(--up);} .mdiff.down{color:var(--down);} .mdiff.none{color:var(--faint);font-weight:600;}
.bwtotal{font-size:11px;color:var(--dim);margin:4px 0 16px;letter-spacing:.02em;}

.bars{display:flex;flex-direction:column;gap:8px;}
.barrow{display:flex;align-items:center;gap:10px;}
.barname{font-size:12px;font-weight:700;width:34px;flex-shrink:0;color:var(--ink);}
.bartrack{flex:1;height:10px;border-radius:5px;background:var(--steel2);overflow:hidden;}
.barfill{display:block;height:100%;border-radius:5px;}
.bg-0{background:#E23B3B;} .bg-1{background:#2E6BE0;} .bg-2{background:#EFC03A;}
.bg-3{background:#8A5FD6;} .bg-4{background:#37A05C;} .bg-5{background:#3E9AA3;} .bg-6{background:#C4703A;}
.barnum{font-size:12px;font-weight:800;width:26px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
.nodata{font-size:13px;color:var(--dim);text-align:center;padding:12px 0 4px;}

.days{margin-bottom:20px;}
.daycard{background:var(--steel);border-radius:12px;margin-bottom:6px;overflow:hidden;}
.daycard.rest{background:transparent;box-shadow:inset 0 0 0 1px var(--line);}
.dayhead{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;text-align:left;}
.dayhead:disabled{cursor:default;}
.daydate{font-size:13px;font-weight:800;letter-spacing:.04em;flex-shrink:0;font-variant-numeric:tabular-nums;}
.daycard.rest .daydate{color:var(--dim);font-weight:600;}
.daydate em{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--void);
  background:var(--ink);border-radius:4px;padding:2px 5px;margin-left:7px;vertical-align:2px;}
.daychips{display:flex;gap:4px;flex:1;}
.gdot{width:8px;height:8px;border-radius:50%;display:block;}
.daymeta{font-size:11px;color:var(--dim);margin-left:auto;flex-shrink:0;font-variant-numeric:tabular-nums;}
.daymeta.off{color:var(--faint);letter-spacing:.1em;}
.dayitems{border-top:1px solid var(--line);padding:12px 14px 14px;}
.dayex{display:flex;align-items:center;gap:9px;padding:7px 0;}
.dayex .ex-name{font-size:13px;font-weight:600;flex:0 1 auto;}
.daysets{font-size:11px;color:var(--dim);margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;}
.dayitems .ghost{margin-top:10px;text-align:center;}

.logrow{display:block;width:100%;text-align:left;background:var(--steel);border-radius:16px;padding:15px;margin-bottom:10px;}
.logtop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.e1rm{font-size:11px;color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums;}
.e1rm b{font-size:22px;color:var(--ink);font-weight:900;letter-spacing:-.02em;margin-right:1px;}
.deltas{display:flex;gap:6px;align-items:center;margin:10px 0 6px;}
.delta{font-size:13px;font-weight:800;padding:6px 10px;border-radius:8px;background:var(--steel2);color:var(--dim);
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;}
.delta em{font-style:normal;font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.06em;}
.delta.up{background:rgba(61,214,140,.13);color:var(--up);}
.delta.down{background:rgba(255,107,107,.13);color:var(--down);}
.delta.flat{color:var(--hold);}
.delta.none{color:var(--faint);}
.stall{font-size:10px;font-weight:800;color:var(--hold);background:rgba(242,183,5,.13);padding:6px 9px;border-radius:8px;
  margin-left:auto;letter-spacing:.08em;}
.trend{width:100%;height:56px;display:block;}

.histrow{background:var(--steel);border-radius:14px;padding:14px 15px;margin-bottom:8px;}
.histdate{font-size:11px;font-weight:800;color:var(--faint);margin-bottom:9px;letter-spacing:.1em;}
.histrow .sets{padding:0;}
.histvol{font-size:11px;color:var(--dim);margin-top:9px;letter-spacing:.02em;}
.back{font-size:13px;color:var(--dim);font-weight:700;margin-bottom:12px;}
.filerow{display:flex;gap:8px;margin-top:12px;}
.filerow .ghost{flex:1;text-align:center;padding:13px;font-size:12px;}
.filelabel{position:relative;overflow:hidden;display:block;}
.filelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.ver{font-size:10px;color:var(--faint);margin-top:14px;text-align:right;letter-spacing:.08em;}

.share{background:var(--steel);border-radius:16px;padding:18px;margin:20px 0 10px;}
.share p{font-size:11px;color:var(--dim);line-height:1.9;margin:12px 0 14px;}
.share .frow{gap:8px;}
.share .ghost{flex:1;text-align:center;padding:14px;}
.sharemain{width:100%;padding:15px;border-radius:12px;background:transparent;border:1.5px solid #06C755;
  color:#3DDD7E;font-weight:800;font-size:13px;letter-spacing:.04em;margin-top:8px;}
.sharebtn{margin-top:10px;}
.imgbtn{width:100%;padding:16px;border-radius:12px;background:var(--act);color:#fff;font-weight:900;font-size:14px;letter-spacing:.04em;}
.imgbox{margin-top:14px;}
.imgbox img{width:100%;border-radius:12px;display:block;box-shadow:0 8px 28px rgba(0,0,0,.6);}
.imgbox .ghost{display:block;text-align:center;margin-top:10px;text-decoration:none;padding:13px;}
.pastebox{margin-top:14px;}
.pastebox textarea{width:100%;height:110px;padding:13px;border-radius:10px;border:1px solid var(--line);
  background:var(--void);color:var(--ink);font-size:13px;font-family:inherit;resize:vertical;margin-bottom:10px;}
.pastebox textarea:focus{outline:none;border-color:var(--act);}
.pastebox .fsave{width:100%;}
.warn{font-size:11px;color:var(--dim);margin-top:9px;text-align:center;}
.note{font-size:12px;color:var(--act-lit);background:rgba(46,107,224,.12);border-radius:9px;padding:11px 13px;
  margin-top:14px;line-height:1.8;}

.sheet-wrap{position:fixed;inset:0;background:rgba(5,6,8,.7);z-index:50;display:flex;align-items:flex-end;
  backdrop-filter:blur(3px);}
.sheet{background:var(--steel);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;
  padding:8px 14px 22px;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.6);}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:5px auto 14px;}
.search{width:100%;padding:14px;border-radius:11px;border:1px solid var(--line);font-size:16px;
  background:var(--void);color:var(--ink);margin-bottom:10px;font-family:inherit;}
.search::placeholder{color:var(--faint);}
.search:focus{outline:none;border-color:var(--act);}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 12px;margin:0 -14px;scrollbar-width:none;}
.gtabs::-webkit-scrollbar{display:none;}
.gtab{flex-shrink:0;padding:10px 15px;border-radius:20px;background:var(--steel2);font-size:13px;font-weight:700;
  color:var(--dim);display:flex;align-items:center;gap:6px;transition:.12s;}
.gtab em{font-style:normal;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;}
.gtab.on{background:var(--ink);color:var(--void);}
.gtab.on em{color:var(--dim);}
.picklist{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sechead{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--faint);
  padding:14px 6px 7px;position:sticky;top:0;background:var(--steel);}
.pickempty{padding:30px 12px;text-align:center;font-size:13px;color:var(--dim);line-height:1.8;}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;padding:15px 6px;text-align:left;border-bottom:1px solid var(--line);}
.pickrow.new{color:var(--act-lit);font-weight:700;font-size:14px;}
.freq{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;}
.pickwrap{display:flex;align-items:center;border-bottom:1px solid var(--line);}
.pickwrap .pickrow{border-bottom:none;flex:1;min-width:0;}
.mine{font-size:10px;font-weight:800;color:var(--act-lit);background:rgba(46,107,224,.16);padding:3px 7px;border-radius:4px;flex-shrink:0;}
.del{width:40px;height:40px;font-size:20px;color:var(--faint);flex-shrink:0;border-radius:9px;}
.del:active{background:var(--steel2);}

.newform{padding:16px 6px 6px;}
.newform .search{margin-bottom:16px;}
.flabel{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--faint);margin:0 0 9px 2px;}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.fchip{padding:10px 14px;border-radius:10px;background:var(--steel2);font-size:13px;font-weight:700;color:var(--dim);}
.fchip.on{background:var(--act);color:#fff;}
.bwtoggle{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:11px;
  background:var(--steel2);font-size:13px;font-weight:600;color:var(--dim);margin-bottom:16px;text-align:left;}
.bwtoggle.on{color:var(--act-lit);}
.bwtoggle .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.bwtoggle.on .box{background:var(--act);border-color:var(--act);color:#fff;}
.frow{display:flex;gap:8px;align-items:center;}
.fsave{flex:1;padding:16px;border-radius:12px;background:var(--act);color:#fff;font-weight:900;font-size:14px;}
.fsave:disabled{background:var(--steel2);color:var(--faint);}

@media (prefers-reduced-motion:reduce){.app *{transition:none!important;}}
